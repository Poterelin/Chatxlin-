<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .box {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #30363d;
            border-top-color: #58a6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #fallback { display: none; }
        h1 { font-size: 1.5rem; margin-bottom: 10px; color: #f0f6fc; }
        p { color: #8b949e; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div class="box" id="loading">
        <div class="spinner"></div>
        <p>Connessione al server in corso...</p>
    </div>

    <div class="box" id="fallback">
        <h1>🔴 Server offline</h1>
        <p>Il server principale è momentaneamente spento.</p>
    </div>

    <script>
        const HOME_URL = 'http://chatxlin.duckdns.org:8080';
        const TIMEOUT  = 2500;

        async function checkHome() {
            try {
                const ctrl = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), TIMEOUT);

                await fetch(HOME_URL + '/favicon.ico', {
                    method: 'HEAD',
                    mode: 'no-cors',
                    signal: ctrl.signal
                });

                clearTimeout(timer);
                window.location.replace(HOME_URL);
            } catch (e) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            }
        }

        checkHome();
    </script>

</body>
</html>
